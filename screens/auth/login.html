<!doctype html>
<!-- Tela: Login com e-mail e senha. Etapa inicial: HTML + CSS estáticos com dados fictícios, sem JavaScript funcional. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Peddi</title>
    <link rel="icon" href="../assets/img/logo.svg" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="">
    <main class="auth">
      <section class="hero">
        <a class="logo lt" href="../../index.html"
          ><img
            src="../assets/img/logo.svg"
            alt=""
            width="30"
            height="30"
          /><span>Peddi</span></a
        >
        <div>
          <p class="kick y">Feito para quem ama pizza</p>
          <h1>Tudo fluindo, do forno até a porta.</h1>
          <p>
            Simples para pedir. Poderoso para gerenciar. Rápido para entregar.
          </p>
        </div>
      </section>
      <section class="pane">
        <form class="fm" action="../client/menu.html">
          <p class="kick">Acesse sua conta</p>
          <h2>Que bom ter você de volta</h2>
          <p class="mu">Entre com seus dados para continuar.</p>
          <div class="f err">
            <label for="e">E-mail</label
            ><input
              id="e"
              type="email"
              name="email"
              placeholder="voce@email.com"
              autocomplete="email"
            /><small>Digite um e-mail válido</small>
          </div>
          <div class="f">
            <label for="s">Senha</label
            ><input
              id="s"
              type="password"
              name="senha"
              placeholder="Mínimo de 8 caracteres"
              autocomplete="current-password"
            /><a class="lk" href="#">Esqueci minha senha</a>
          </div>
          <button class="btn block" type="submit">Entrar</button>
          <p class="alt">
            Ainda não tem conta? <a href="register.html">Cadastre-se</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
