<!doctype html>
<!-- Tela: Pedidos Prontos (bairro, itens e valor) com seleção de até 3. Etapa inicial: HTML + CSS estáticos com dados fictícios, sem JavaScript funcional. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedidos disponíveis | Peddi</title>
    <link rel="icon" href="../assets/img/logo.svg" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="">
    <header class="chead">
      <div class="chead-in">
        <a class="logo mk" href="available.html">
          <img src="../assets/img/logo.svg" alt="" width="30" height="30" />
          <span>Peddi</span>
        </a>

        <div>
          <p class="kick">Peddi entregas</p>
          <h2>Pedidos disponíveis</h2>
        </div>

        <span class="av r">CA</span>
      </div>
    </header>

    <main class="cwrap">
      <p class="kick">Perto de você</p>

      <div class="row2">
        <div>
          <h1 class="h1">Prontos para retirada</h1>
          <p class="mu">Selecione até 3 pedidos para montar sua viagem.</p>
        </div>
        <span class="bd s5">4 prontos</span>
      </div>

      <div class="list">
        <label class="pick card">
          <input type="checkbox" checked />
          <div>
            <div class="row2">
              <b class="rd">#1046</b>
              <span class="bd s3">Pronto</span>
            </div>
            <h3 class="bairro">Saúde</h3>
            <small class="bl">2× Margherita</small>
            <div class="row2 ft">
              <b>R$ 76,00</b>
              <small class="wt">há 21 min de espera</small>
            </div>
          </div>
        </label>

        <label class="pick card">
          <input type="checkbox" checked />
          <div>
            <div class="row2">
              <b class="rd">#1050</b>
              <span class="bd s3">Pronto</span>
            </div>
            <h3 class="bairro">Paraíso</h3>
            <small class="bl">1× Calabresa</small>
            <div class="row2 ft">
              <b>R$ 48,00</b>
              <small class="wt">há 8 min de espera</small>
            </div>
          </div>
        </label>

        <label class="pick card">
          <input type="checkbox" />
          <div>
            <div class="row2">
              <b class="rd">#1051</b>
              <span class="bd s3">Pronto</span>
            </div>
            <h3 class="bairro">Ipiranga</h3>
            <small class="bl">2× Portuguesa</small>
            <div class="row2 ft">
              <b>R$ 98,00</b>
              <small class="wt">há 14 min de espera</small>
            </div>
          </div>
        </label>

        <label class="pick card">
          <input type="checkbox" />
          <div>
            <div class="row2">
              <b class="rd">#1052</b>
              <span class="bd s3">Pronto</span>
            </div>
            <h3 class="bairro">Cambuci</h3>
            <small class="bl">1× Margherita</small>
            <div class="row2 ft">
              <b>R$ 44,00</b>
              <small class="wt">há 18 min de espera</small>
            </div>
          </div>
        </label>
      </div>
    </main>

    <div class="dock">
      <div class="dock-in">
        <div>
          <b>2 de 3 selecionados</b><br />
          <small>Tudo certo para começar</small>
        </div>
        <a class="btn" href="trip.html">
          Iniciar viagem
          <svg
            class="i"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </a>
      </div>
    </div>
  </body>
</html>
