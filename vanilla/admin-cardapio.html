<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cardápio · Peddi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/img/logo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/pages/admin.css" />
    <link rel="stylesheet" href="/src/styles/pages/admin-products.css" />
  </head>
  <body>
    <a class="sr" href="#main">Ir para o conteúdo</a>
    <div class="demo" id="demo" role="region" aria-label="Controles de demonstração"></div>
    <div class="adm">
      <aside class="side" id="menu-lateral" aria-label="Navegação do estabelecimento"></aside>
      <div class="scrim" id="scrim"></div>
      <main class="adm-main" id="main">
        <div class="adm-top">
          <button class="icon-btn burger" id="abrir-menu" type="button" aria-label="Abrir menu" aria-expanded="false"><span data-icon="menu" data-size="20"></span></button>
          <h1 class="grow">Cardápio</h1>
          <button class="btn btn-primary" id="novo-produto" type="button"><span data-icon="plus" data-size="16"></span> Novo produto</button>
        </div>

        <form id="form-produto" class="panel product-form" hidden novalidate>
          <div class="panel-hd"><h2 id="titulo-form">Novo produto</h2><button class="icon-btn" id="cancelar-edicao" type="button" aria-label="Cancelar edição">×</button></div>
          <div class="product-fields">
            <div class="field">
              <label for="produto-nome">Nome <span class="req" aria-hidden="true">*</span></label>
              <input id="produto-nome" name="name" type="text" maxlength="100" required />
            </div>
            <div class="field">
              <label for="produto-categoria">Categoria <span class="req" aria-hidden="true">*</span></label>
              <input id="produto-categoria" name="category" type="text" list="categorias-produto" maxlength="50" required />
              <datalist id="categorias-produto"></datalist>
            </div>
            <div class="field">
              <label for="produto-preco">Preço (R$) <span class="req" aria-hidden="true">*</span></label>
              <input id="produto-preco" name="price" type="text" inputmode="decimal" placeholder="29,90" required />
            </div>
            <div class="field product-image-field">
              <label for="produto-imagem">Imagem do produto</label>
              <input id="produto-imagem" name="image" type="file" accept="image/png,image/jpeg,image/webp" />
              <p class="hint" id="imagem-ajuda">PNG, JPEG ou WebP, até 1,5 MB. Sem foto, o cardápio mostra um ícone.</p>
            </div>
            <div class="field product-description">
              <label for="produto-descricao">Descrição</label>
              <textarea id="produto-descricao" name="description" rows="3" maxlength="240"></textarea>
            </div>
          </div>
          <p class="err" id="erro-produto" role="alert"></p>
          <div class="row">
            <button class="btn btn-primary" id="salvar-produto" type="submit">Cadastrar produto</button>
            <button class="btn btn-ghost" id="cancelar-form" type="button">Cancelar</button>
          </div>
        </form>

        <section aria-labelledby="titulo-lista">
          <div class="product-list-heading"><div><h2 id="titulo-lista">Produtos cadastrados</h2><p class="muted small" id="contagem-produtos"></p></div></div>
          <div id="lista-produtos" class="product-list" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/admin-products.js"></script>
  </body>
</html>
