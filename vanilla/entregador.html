<!doctype html>
<!-- entregador.html — Painel do Entregador: Pedidos Prontos, Seleção e Viagem -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Peddi — Entregador</title>
    <link rel="icon" href="/img/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { renderCourierAvailable } from "./src/pages/courier-available.js";
      import { renderCourierTrip } from "./src/pages/courier-trip.js";
      import { obterViagemAtual } from "./src/services/orders.js";

      function rotearEntregador() {
        const root = document.getElementById("app");
        const viagem = obterViagemAtual();

        // RF-ENT-04: Critério 5 - Reabrir o sistema retoma a viagem atual
        if (location.hash === "#/courier/trip" || (viagem && location.hash !== "#/courier/available")) {
          renderCourierTrip(root);
        } else {
          renderCourierAvailable(root);
        }
      }

      window.addEventListener("hashchange", rotearEntregador);
      rotearEntregador();
    </script>
  </body>
</html>
